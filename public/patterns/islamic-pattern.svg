<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="islamic-star" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- 8-pointed star pattern -->
      <polygon points="25,0 30,20 50,25 30,30 25,50 20,30 0,25 20,20" fill="currentColor" opacity="0.1"/>
      <!-- Connecting lines -->
      <line x1="0" y1="0" x2="25" y2="25" stroke="currentColor" stroke-width="0.5" opacity="0.05"/>
      <line x1="50" y1="0" x2="25" y2="25" stroke="currentColor" stroke-width="0.5" opacity="0.05"/>
      <line x1="0" y1="50" x2="25" y2="25" stroke="currentColor" stroke-width="0.5" opacity="0.05"/>
      <line x1="50" y1="50" x2="25" y2="25" stroke="currentColor" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#islamic-star)"/>
  <!-- Center decoration -->
  <circle cx="50" cy="50" r="3" fill="currentColor" opacity="0.1"/>
  <circle cx="0" cy="0" r="3" fill="currentColor" opacity="0.1"/>
  <circle cx="100" cy="0" r="3" fill="currentColor" opacity="0.1"/>
  <circle cx="0" cy="100" r="3" fill="currentColor" opacity="0.1"/>
  <circle cx="100" cy="100" r="3" fill="currentColor" opacity="0.1"/>
</svg>
